# Vitale — SDD configuration
# Generated by sdd-init (bootstrap). Source of truth for behavior remains the repo.
schema: spec-driven
project: vitale
artifact_store: both   # write openspec/ files AND cache context in Engram

context: |
  Vitale converts HTML and MHTML into clean Markdown, 100% on-device
  (no servers, no accounts, no telemetry). MIT license.
  Stack: Flutter 3.47.2 / Dart 3.13.2, targets Android, iOS, Web.
  Arch: Clean Architecture, 3 layers, feature-first. Dependency rule:
  Presentation -> Domain <- Data; domain imports nothing outward.
  State: Riverpod 3.4.3 (flutter_riverpod), no codegen.
  Conversion engine (default): html2md 1.3.2 (Dart pure).
  Functional source of truth: prototipe/ (vanilla web prototype).
  Architectural source of truth: "Especificación de Arquitectura - Vitale (Flutter).md".

architecture:
  pattern: Clean Architecture (3 layers, feature-first, Screaming Architecture)
  dependency_rule: "Presentation -> Domain <- Data"
  forbidden:
    - "domain/ importing flutter, external clients, data/, or presentation/"
    - "relative imports (../, ./) — internal files MUST use package:vitale/... paths"
    - "presentation/ skipping layers to reach data/ repositories directly"
    - "controllers containing business logic (they translate and delegate only)"
  state_management:
    library: flutter_riverpod
    version: "^3.4.3 (resolved 3.4.3)"
    codegen: false
    composition_root: "lib/main.dart (ProviderScope) + lib/app.dart"
  source_of_truth:
    functional: "prototipe/"
    architectural: "Especificación de Arquitectura - Vitale (Flutter).md"
    conflict_rule: "prototype wins on functional behavior; spec wins on architectural structure"
  spec_section_map:
    "§3": "Estructura de Carpetas (authoritative lib/ layout, lines ~88-220)"
    "§4": "Contratos del Dominio (entities, repositories, usecases, failures)"
    "§5": "Implementación de la Capa Data (MHTML parser, extractors, engines)"
    "§6.5": "Providers y Composition Root (Riverpod wiring, lines ~1032-1085)"
    "§7": "Detección de Plataforma (Android/iOS/Web, lines ~1089-1105)"
    "§9": "Testing (layer layout, fixtures)"
    "§13": "Criterios de Aceptación (lines ~1240-1274)"
    "§14": "Decisiones Pendientes (both resolved: html2md engine, charset_converter)"

conventions:
  imports: "grouped dart: -> package:, blank line between; internal files use package:vitale/... (NO relative imports)"
  files: "snake_case.dart, one responsibility per file"
  classes: "PascalCase; use cases in infinitive (ConvertHtmlToMarkdown)"
  members: "camelCase; private with _ prefix"
  errors: "sealed class Failure + Result<T> (Ok/Err); throw only for programming errors"
  docstrings: "/// on every public class and method"
  linter: "flutter_lints ^6.0.0; strict rules; flutter analyze must be clean"
  extensibility: "new site = create data/extractors/<site>_extractor.dart + register in ExtractorRegistryImpl. Nothing else."
  dependencies: "any dependency not already listed in the spec §11 MUST be listed and confirmed before adding"

testing:
  strict_tdd: true
  test_command: "flutter test"
  analyze_command: "flutter analyze"
  framework: flutter_test
  coverage_command: "flutter test --coverage"
  mocking: "none installed (no mockito/mocktail) — use hand-written fakes"
  existing_tests:
    - test/html2md_engine_test.dart
    - test/markdown_engine_registry_impl_test.dart
    - test/result_test.dart
    - test/widget_test.dart
  note: "Dart VM unit tests + widget tests run without platform dependencies; browser-only tests must be marked @TestOn('browser') or placed in test/web/"

rules:
  proposal:
    - State intent, scope, out-of-scope, and approach
    - Include rollback plan for risky changes
    - Respect functional (prototipe) vs architectural (spec) source-of-truth split
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Respect the dependency rule Presentation -> Domain <- Data
    - Document architecture decisions with rationale
    - For extractor/engine changes, keep the one-file-plus-register extensibility contract
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns (Riverpod manual providers, package:vitale/ imports)
    - tdd: true
    - test_command: "flutter test"
  verify:
    - test_command: "flutter test"
    - analyze_command: "flutter analyze"
    - build_command: "flutter build web"
    - coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
